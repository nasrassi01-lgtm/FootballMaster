<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Football Master ⚽</h1>

    <h2>How well do you know football?</h2>

    <p>Answer 10 football questions and earn points!</p>

    <p>Highscore: <span id="highscore">0</span></p>

    <button id="start-btn">Start Game</button>
    <div id="quiz" style="display: none;">

    <h2 id="question">Question goes here</h2>

    <button id="answer1">Answer 1</button>
    <button id="answer2">Answer 2</button>
    <button id="answer3">Answer 3</button>
    <button id="answer4">Answer 4</button>

    <p id="score">Score: 0</p>
<button id="next-btn" style="display: none;">
    Next Question
</button>
</div>
    <script src="script.js"></script>

</body>
</html>
